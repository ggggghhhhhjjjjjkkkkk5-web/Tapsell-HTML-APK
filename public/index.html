<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ویدئوساز هوش مصنوعی</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#eef2ff;font:16px Tahoma,Arial}.wrap{max-width:760px;margin:35px auto;padding:18px}.card{background:#151d33;border:1px solid #293653;border-radius:18px;padding:22px;margin:14px 0}h1{font-size:25px}label{display:block;margin:14px 0 7px;color:#cbd5e1}textarea,input,select{width:100%;padding:13px;border-radius:10px;border:1px solid #405071;background:#0d1528;color:white;font:inherit}textarea{min-height:140px}button{background:#8b7cff;color:white;border:0;border-radius:10px;padding:14px 22px;font:inherit;font-weight:bold;width:100%;margin-top:16px}button:disabled{opacity:.5}.muted{color:#9eacc8;font-size:13px;line-height:1.9}#status{white-space:pre-wrap;margin-top:14px;line-height:1.9}video{width:100%;margin-top:14px;border-radius:12px}</style><div class="wrap"><h1>🎬 ویدئوساز هوش مصنوعی</h1><p class="muted">ساخت ویدئو از متن با موتور LTX-Video</p><div class="card"><label>پرامپت ویدئو</label><textarea id="prompt" placeholder="توضیح دقیق صحنه، حرکت دوربین، نور و جزئیات..."></textarea><label>پرامپت منفی</label><input id="negative" value="blurry, low quality, flicker, watermark"><label>مدت ویدئو</label><select id="duration"><option>3</option><option selected>5</option><option>6</option><option>8</option></select><label>نسبت تصویر</label><select id="ratio"><option value="9:16">عمودی 9:16</option><option value="16:9">افقی 16:9</option><option value="1:1">مربعی 1:1</option></select><label>Seed</label><input id="seed" type="number" value="42"><button id="go">تولید ویدئو</button><div id="status"></div><video id="video" controls playsinline hidden></video><a id="download" hidden download="video-ai.mp4">⬇ دانلود ویدئو</a></div><p class="muted">تولید به صف و ظرفیت GPU سرویس عمومی وابسته است و تضمین زمانی ندارد.</p></div><script>const $=id=>document.getElementById(id);let busy=false;const sleep=ms=>new Promise(r=>setTimeout(r,ms));$('go').onclick=async()=>{if(busy)return;const prompt=$('prompt').value.trim();if(!prompt){$('status').textContent='ابتدا پرامپت را وارد کن';return}busy=true;$('go').disabled=true;$('video').hidden=true;$('download').hidden=true;try{const r=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt,negativePrompt:$('negative').value,duration:+$('duration').value,ratio:$('ratio').value,seed:+$('seed').value})}),j=await r.json();if(!r.ok)throw Error(j.error||'ارسال درخواست ناموفق بود');const start=Date.now();while(Date.now()-start<360000){await sleep(2500);const x=await fetch('/api/jobs/'+j.id),v=await x.json();$('status').textContent=v.message+'\nزمان سپری‌شده: '+Math.floor((Date.now()-start)/1000)+' ثانیه';if(v.status==='completed'){$('video').src=v.videoUrl;$('video').hidden=false;$('download').href=v.videoUrl;$('download').hidden=false;break}if(v.status==='failed')throw Error(v.message)}}catch(e){$('status').textContent='خطا: '+e.message}finally{busy=false;$('go').disabled=false}};</script></html>
