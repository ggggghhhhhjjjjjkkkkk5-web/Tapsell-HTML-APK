name: Validate Bale Membership Bot

on:
  push:
    paths:
      - 'bale-bot/**'
      - '.github/workflows/validate-bale-bot.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check bale-bot/server.js
