name: Build Instagram Downloader APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'instagram-downloader/**'
      - '.github/workflows/build-instagram-downloader.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: instagram-downloader
        env:
          TAPSELL_APP_KEY: ${{ secrets.TAPSELL_APP_KEY }}
        run: |
          if [ -z "$TAPSELL_APP_KEY" ]; then echo "Missing TAPSELL_APP_KEY repository secret"; exit 1; fi
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: instagram-downloader-debug
          path: instagram-downloader/app/build/outputs/apk/debug/app-debug.apk

